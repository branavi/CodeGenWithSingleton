#Demo Pipeline
trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: 'Junit'
    displayName: 'Junit Stage'
    jobs:
      - job: 'JunitTest'
        displayName: 'Running unitTest'
        steps:
          - script: echo 'Running Springdemo app unit test'

  - stage: 'IntegrationTest'
    displayName: 'IntegrationTest'
    jobs:
      - job: 'IntegrationTest'
        displayName: 'Running integrationTest'
        steps:
          - script: echo 'Running Springdemo app unit test'